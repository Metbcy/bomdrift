name: bomdrift
description: SBOM diff with supply-chain risk signals — flags new CVEs, typosquats, multi-major version jumps, and young maintainers on changed dependencies, posted as a PR comment.
branding:
  icon: shield
  color: blue

inputs:
  before-sbom:
    description: Path to the "before" SBOM (CycloneDX, SPDX, or Syft JSON).
    required: true
  after-sbom:
    description: Path to the "after" SBOM (CycloneDX, SPDX, or Syft JSON).
    required: true
  format:
    description: Force input format detection (auto|cdx|spdx|syft).
    default: auto
  output:
    description: Output format (terminal|markdown|json|sarif).
    default: markdown
  comment-on-pr:
    description: Post the diff as a PR comment when run on a pull_request event.
    default: 'true'
  fail-on:
    description: Threshold to fail the action (none|cve|critical-cve|typosquat|any).
    default: none
  github-token:
    description: Token used to post PR comments. Defaults to GITHUB_TOKEN.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install cosign (for release signature verification)
      uses: sigstore/cosign-installer@v3
    - name: Run bomdrift
      shell: bash
      run: ${{ github.action_path }}/entrypoint.sh
      env:
        BEFORE_SBOM: ${{ inputs.before-sbom }}
        AFTER_SBOM: ${{ inputs.after-sbom }}
        INPUT_FORMAT: ${{ inputs.format }}
        OUTPUT_FORMAT: ${{ inputs.output }}
        COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        FAIL_ON: ${{ inputs.fail-on }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
