# Azure DevOps Pipelines template for bomdrift.

trigger: none

pr:
  branches:
    include:
      - "*"

# Template parameter consumed by the comment-suppress bridge
# (examples/azure-devops/comment-bridge/). When the bridge triggers
# this pipeline via POST /_apis/pipelines/{id}/runs it sets
# BOMDRIFT_NOTE_BODY; the suppress stage below is gated on that
# parameter being non-empty. Normal PR-build runs leave it empty,
# the suppress stage is skipped, and only the diff stage runs.
parameters:
  - name: BOMDRIFT_NOTE_BODY
    type: string
    default: ""
  # VEX
  - name: vex
    type: string
    default: ""
  - name: emit_vex
    type: string
    default: ""
  - name: vex_author
    type: string
    default: ""
  - name: vex_default_justification
    type: string
    default: ""
  # License policy
  - name: allow_licenses
    type: string
    default: ""
  - name: deny_licenses
    type: string
    default: ""
  - name: allow_exception
    type: string
    default: ""
  - name: deny_exception
    type: string
    default: ""
  - name: allow_ambiguous_licenses
    type: boolean
    default: false
  # Enrichment toggles
  - name: no_epss
    type: boolean
    default: false
  - name: no_kev
    type: boolean
    default: false
  - name: no_registry
    type: boolean
    default: false
  - name: fail_on_epss
    type: string
    default: ""
  # Calibration
  - name: recently_published_days
    type: string
    default: ""
  - name: typosquat_similarity_threshold
    type: string
    default: ""
  - name: young_maintainer_days
    type: string
    default: ""
  - name: cache_ttl_hours
    type: string
    default: ""
  - name: multi_major_delta
    type: string
    default: ""
  # Attestation
  - name: before_attestation
    type: string
    default: ""
  - name: after_attestation
    type: string
    default: ""
  - name: cosign_identity
    type: string
    default: ""
  - name: cosign_issuer
    type: string
    default: ""
  - name: require_attestation
    type: boolean
    default: false
  # Plugins
  - name: plugin
    type: string
    default: ""

pool:
  vmImage: ubuntu-latest

variables:
  BOMDRIFT_VERSION: "0.9.0"

stages:
  - stage: bomdrift_diff
    condition: eq('${{ parameters.BOMDRIFT_NOTE_BODY }}', '')
    jobs:
      - job: diff
        steps:
          - script: |
              set -euo pipefail
              sudo apt-get update -qq && sudo apt-get install -y -qq curl jq
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              . "$HOME/.cargo/env"
              cargo install bomdrift --locked --version "$BOMDRIFT_VERSION"
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
            displayName: Install bomdrift + Syft

          - script: |
              set -euo pipefail
              . "$HOME/.cargo/env"
              git fetch origin "$(System.PullRequest.TargetBranch)"
              git worktree add ../before "origin/$(System.PullRequest.TargetBranch)"
              syft dir:../before -o cyclonedx-json=before.cdx.json
              syft dir:. -o cyclonedx-json=after.cdx.json
              # Build optional --flag args from the pipeline parameters
              # exposed via the env: block below. Empty / false values
              # contribute zero args, so users who set none of these get
              # the byte-identical v0.9 invocation.
              args=()
              add_value() {
                if [ -n "$2" ]; then args+=("$1" "$2"); fi
              }
              add_bool() {
                if [ "$2" = "true" ]; then args+=("$1"); fi
              }
              add_list() {
                if [ -z "$2" ]; then return 0; fi
                while IFS= read -r _line; do
                  if [ -n "$_line" ]; then args+=("$1" "$_line"); fi
                done <<EOF
              $2
              EOF
              }
              # VEX
              add_list  --vex "${BOMDRIFT_VEX:-}"
              add_value --emit-vex "${BOMDRIFT_EMIT_VEX:-}"
              add_value --vex-author "${BOMDRIFT_VEX_AUTHOR:-}"
              add_value --vex-default-justification "${BOMDRIFT_VEX_DEFAULT_JUSTIFICATION:-}"
              # License policy
              add_value --allow-licenses "${BOMDRIFT_ALLOW_LICENSES:-}"
              add_value --deny-licenses "${BOMDRIFT_DENY_LICENSES:-}"
              add_value --allow-exception "${BOMDRIFT_ALLOW_EXCEPTION:-}"
              add_value --deny-exception "${BOMDRIFT_DENY_EXCEPTION:-}"
              add_bool  --allow-ambiguous-licenses "${BOMDRIFT_ALLOW_AMBIGUOUS_LICENSES:-}"
              # Enrichment toggles
              add_bool  --no-epss "${BOMDRIFT_NO_EPSS:-}"
              add_bool  --no-kev "${BOMDRIFT_NO_KEV:-}"
              add_bool  --no-registry "${BOMDRIFT_NO_REGISTRY:-}"
              add_value --fail-on-epss "${BOMDRIFT_FAIL_ON_EPSS:-}"
              # Calibration
              add_value --recently-published-days "${BOMDRIFT_RECENTLY_PUBLISHED_DAYS:-}"
              add_value --typosquat-similarity-threshold "${BOMDRIFT_TYPOSQUAT_SIMILARITY_THRESHOLD:-}"
              add_value --young-maintainer-days "${BOMDRIFT_YOUNG_MAINTAINER_DAYS:-}"
              add_value --cache-ttl-hours "${BOMDRIFT_CACHE_TTL_HOURS:-}"
              add_value --multi-major-delta "${BOMDRIFT_MULTI_MAJOR_DELTA:-}"
              # Attestation
              add_value --before-attestation "${BOMDRIFT_BEFORE_ATTESTATION:-}"
              add_value --after-attestation "${BOMDRIFT_AFTER_ATTESTATION:-}"
              add_value --cosign-identity "${BOMDRIFT_COSIGN_IDENTITY:-}"
              add_value --cosign-issuer "${BOMDRIFT_COSIGN_ISSUER:-}"
              add_bool  --require-attestation "${BOMDRIFT_REQUIRE_ATTESTATION:-}"
              # Plugins
              add_list --plugin "${BOMDRIFT_PLUGIN:-}"
              bomdrift diff before.cdx.json after.cdx.json \
                --output markdown --platform azure-devops "${args[@]}" > comment.md
              printf '\n<!-- bomdrift:diff -->\n' >> comment.md
            displayName: bomdrift diff
            env:
              BOMDRIFT_VEX: ${{ parameters.vex }}
              BOMDRIFT_EMIT_VEX: ${{ parameters.emit_vex }}
              BOMDRIFT_VEX_AUTHOR: ${{ parameters.vex_author }}
              BOMDRIFT_VEX_DEFAULT_JUSTIFICATION: ${{ parameters.vex_default_justification }}
              BOMDRIFT_ALLOW_LICENSES: ${{ parameters.allow_licenses }}
              BOMDRIFT_DENY_LICENSES: ${{ parameters.deny_licenses }}
              BOMDRIFT_ALLOW_EXCEPTION: ${{ parameters.allow_exception }}
              BOMDRIFT_DENY_EXCEPTION: ${{ parameters.deny_exception }}
              BOMDRIFT_ALLOW_AMBIGUOUS_LICENSES: ${{ parameters.allow_ambiguous_licenses }}
              BOMDRIFT_NO_EPSS: ${{ parameters.no_epss }}
              BOMDRIFT_NO_KEV: ${{ parameters.no_kev }}
              BOMDRIFT_NO_REGISTRY: ${{ parameters.no_registry }}
              BOMDRIFT_FAIL_ON_EPSS: ${{ parameters.fail_on_epss }}
              BOMDRIFT_RECENTLY_PUBLISHED_DAYS: ${{ parameters.recently_published_days }}
              BOMDRIFT_TYPOSQUAT_SIMILARITY_THRESHOLD: ${{ parameters.typosquat_similarity_threshold }}
              BOMDRIFT_YOUNG_MAINTAINER_DAYS: ${{ parameters.young_maintainer_days }}
              BOMDRIFT_CACHE_TTL_HOURS: ${{ parameters.cache_ttl_hours }}
              BOMDRIFT_MULTI_MAJOR_DELTA: ${{ parameters.multi_major_delta }}
              BOMDRIFT_BEFORE_ATTESTATION: ${{ parameters.before_attestation }}
              BOMDRIFT_AFTER_ATTESTATION: ${{ parameters.after_attestation }}
              BOMDRIFT_COSIGN_IDENTITY: ${{ parameters.cosign_identity }}
              BOMDRIFT_COSIGN_ISSUER: ${{ parameters.cosign_issuer }}
              BOMDRIFT_REQUIRE_ATTESTATION: ${{ parameters.require_attestation }}
              BOMDRIFT_PLUGIN: ${{ parameters.plugin }}

          - script: |
              set -euo pipefail
              ORG_URL="$(System.TeamFoundationCollectionUri)"
              PROJECT="$(System.TeamProject)"
              REPO_ID="$(Build.Repository.ID)"
              PR_ID="$(System.PullRequest.PullRequestId)"
              API="${ORG_URL}${PROJECT}/_apis/git/repositories/${REPO_ID}/pullRequests/${PR_ID}/threads?api-version=7.1"
              AUTH_HEADER="Authorization: Basic $(printf ":%s" "$BOMDRIFT_API_TOKEN" | base64 -w0)"
              EXISTING=$(curl -s -H "$AUTH_HEADER" "$API" \
                | jq -r '.value[] | select(.comments[0].content | tostring | test("<!-- bomdrift:diff -->")) | .id' | head -n1)
              if [ -n "$EXISTING" ]; then
                UPDATE_API="${ORG_URL}${PROJECT}/_apis/git/repositories/${REPO_ID}/pullRequests/${PR_ID}/threads/${EXISTING}/comments/1?api-version=7.1"
                UBODY=$(jq -Rs --arg cmt "$(cat comment.md)" '{content:$cmt, commentType:1}' < /dev/null)
                curl -s -H "$AUTH_HEADER" -H "Content-Type: application/json" -X PATCH "$UPDATE_API" -d "$UBODY" > /dev/null
              else
                BODY=$(jq -Rs --arg cmt "$(cat comment.md)" '{comments:[{parentCommentId:0, content:$cmt, commentType:1}], status:1}' < /dev/null)
                curl -s -H "$AUTH_HEADER" -H "Content-Type: application/json" -X POST "$API" -d "$BODY" > /dev/null
              fi
            displayName: Upsert PR thread
            env:
              BOMDRIFT_API_TOKEN: $(BOMDRIFT_API_TOKEN)

  # Comment-driven suppress stage (advanced).
  #
  # Runs ONLY when triggered by the bomdrift comment-suppress bridge
  # (examples/azure-devops/comment-bridge/), which POSTs to
  # /_apis/pipelines/{id}/runs with `templateParameters.BOMDRIFT_NOTE_BODY`
  # set to the raw comment body. See bridge README for the full
  # security model.
  - stage: bomdrift_suppress
    condition: ne('${{ parameters.BOMDRIFT_NOTE_BODY }}', '')
    jobs:
      - job: suppress
        steps:
          - checkout: self
            persistCredentials: true
          - script: |
              set -euo pipefail
              sudo apt-get update -qq && sudo apt-get install -y -qq curl jq git
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              . "$HOME/.cargo/env"
              cargo install bomdrift --locked --version "$BOMDRIFT_VERSION"
              bomdrift baseline add --from-comment "${BOMDRIFT_NOTE_BODY}"
              git config user.name  "bomdrift-bot"
              git config user.email "bomdrift-bot@users.noreply.dev.azure.com"
              git add .bomdrift/baseline.json
              if git diff --cached --quiet; then
                echo "baseline already contains the directive; nothing to commit"
                exit 0
              fi
              git commit -m "chore(bomdrift): suppress from PR comment"
              git push origin "HEAD:$(Build.SourceBranchName)"
            displayName: bomdrift baseline add --from-comment
            env:
              BOMDRIFT_NOTE_BODY: ${{ parameters.BOMDRIFT_NOTE_BODY }}
