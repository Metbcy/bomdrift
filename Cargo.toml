[package]
name = "bomdrift"
version = "0.6.1"
edition = "2024"
rust-version = "1.85"
description = "SBOM diff with supply-chain risk signals (CVEs, typosquats, maintainer-age)."
license = "Apache-2.0"
repository = "https://github.com/Metbcy/bomdrift"
homepage = "https://metbcy.github.io/bomdrift/"
readme = "README.md"
keywords = ["sbom", "security", "supply-chain", "cyclonedx", "spdx"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "bomdrift"
path = "src/lib.rs"

[[bin]]
name = "bomdrift"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
strsim = "0.11"
owo-colors = { version = "4", features = ["supports-colors"] }
supports-color = "3"
directories = "6"
toml = "0.8"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "diff"
harness = false

[[bench]]
name = "typosquat"
harness = false

[[bench]]
name = "render"
harness = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
