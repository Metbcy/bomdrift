# Pinned to MSRV (1.88) intentionally; bump deliberately when updating Cargo.toml rust-version.
name: release

# Triggered when a SemVer tag (e.g. v0.1.0) is pushed. Builds release binaries
# for every supported target, computes SHA-256 checksums, signs each binary
# with cosign keyless (Sigstore via GitHub OIDC), and attaches everything to
# the corresponding GitHub Release.
#
# Manual reruns: re-run the failed run from the GitHub Actions UI on the
# original tag-push event. Manual workflow_dispatch is intentionally not
# offered for v0.1.0 because it would weaken cosign provenance — the OIDC
# identity for a manual dispatch is branch-based, not tag-based, and
# verification instructions in CHANGELOG.md assume the tag-push identity.

on:
  push:
    tags:
      # Strict SemVer release tags only. Pre-release tags (v0.1.0-rc1) and
      # arbitrary v* tags are deliberately excluded.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write       # create release, upload assets
  id-token: write       # cosign keyless OIDC + SLSA attestation
  attestations: write   # actions/attest-build-provenance
  packages: write       # ghcr.io image push (gated if:false today)

# A second push of the same tag (rare; e.g. a force-push after a fixup) will
# cancel the in-flight run rather than racing it. Different tags can release
# concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  preflight:
    # Cheap validation up-front — fail before spending 4 cross-builds.
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        shell: bash
        run: |
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          if [ "$cargo_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "Cargo.toml version ($cargo_version) does not match tag (${{ steps.tag.outputs.version }})" >&2
            exit 1
          fi

      - name: Verify CHANGELOG.md has an entry for this version
        shell: bash
        run: |
          version="${{ steps.tag.outputs.version }}"
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing a '## [${version}]' section" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            use_cross: false
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (aarch64-linux only)
        if: matrix.use_cross
        shell: bash
        run: cargo install cross --locked --version 0.2.5

      - name: Build release binary (cargo)
        if: '!matrix.use_cross'
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build release binary (cross — aarch64-linux ring/rustls toolchain)
        if: matrix.use_cross
        shell: bash
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Stage archive contents
        id: stage
        shell: bash
        run: |
          tag="${{ needs.preflight.outputs.tag }}"
          target="${{ matrix.target }}"
          stem="bomdrift-${tag}-${target}"
          stage="dist/${stem}"
          mkdir -p "$stage"

          if [[ "$target" == *windows* ]]; then
            cp "target/${target}/release/bomdrift.exe" "$stage/"
          else
            cp "target/${target}/release/bomdrift" "$stage/"
          fi
          cp README.md LICENSE CHANGELOG.md "$stage/"

          echo "stem=$stem" >> "$GITHUB_OUTPUT"

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd dist
          tar -czf "${{ steps.stage.outputs.stem }}.tar.gz" "${{ steps.stage.outputs.stem }}"

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd dist
          7z a "${{ steps.stage.outputs.stem }}.zip" "${{ steps.stage.outputs.stem }}" >/dev/null

      - name: Compute SHA-256
        shell: bash
        run: |
          cd dist
          archive="${{ steps.stage.outputs.stem }}.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign archive with cosign (keyless)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cd dist
          archive="${{ steps.stage.outputs.stem }}.${{ matrix.archive }}"
          cosign sign-blob --yes \
            --output-signature "${archive}.sig" \
            --output-certificate "${archive}.pem" \
            "$archive"

      - name: Upload artifact (per-target)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.stem }}
          path: |
            dist/${{ steps.stage.outputs.stem }}.${{ matrix.archive }}
            dist/${{ steps.stage.outputs.stem }}.${{ matrix.archive }}.sha256
            dist/${{ steps.stage.outputs.stem }}.${{ matrix.archive }}.sig
            dist/${{ steps.stage.outputs.stem }}.${{ matrix.archive }}.pem
          if-no-files-found: error
          retention-days: 7

      # SLSA build provenance for the per-target archive. Complementary
      # to the cosign-keyless signature uploaded just above: cosign
      # proves "the bomdrift maintainer's GitHub OIDC identity signed
      # this blob"; SLSA proves "this blob was produced by the public
      # release.yml workflow on tag ${{ github.ref_name }} in this
      # repo". Verify with `gh attestation verify --owner Metbcy
      # <archive>` or `slsa-verifier verify-artifact --source-uri
      # github.com/Metbcy/bomdrift --source-tag <tag> <archive>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ steps.stage.outputs.stem }}.${{ matrix.archive }}

  publish:
    name: publish release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: ls -la dist

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${{ needs.preflight.outputs.version }}"
          tag="${{ needs.preflight.outputs.tag }}"
          # Print everything between "## [<version>]" and the next "## [" header.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capturing = 1; print; next }
            capturing && /^## \[/    { capturing = 0 }
            capturing                { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release notes for $tag not found in CHANGELOG.md" >&2
            exit 1
          fi
          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Verifying signatures" >> release-notes.md
          echo "" >> release-notes.md
          echo 'Each archive is signed with cosign keyless (Sigstore via GitHub OIDC). To verify a download:' >> release-notes.md
          echo "" >> release-notes.md
          echo '```bash' >> release-notes.md
          echo "cosign verify-blob \\" >> release-notes.md
          echo "  --certificate-identity 'https://github.com/Metbcy/bomdrift/.github/workflows/release.yml@refs/tags/${tag}' \\" >> release-notes.md
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\" >> release-notes.md
          echo "  --certificate bomdrift-${tag}-<target>.<ext>.pem \\" >> release-notes.md
          echo "  --signature bomdrift-${tag}-<target>.<ext>.sig \\" >> release-notes.md
          echo "  bomdrift-${tag}-<target>.<ext>" >> release-notes.md
          echo '```' >> release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: ${{ needs.preflight.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.sig
            dist/*.pem

  # Multi-arch (linux/amd64, linux/arm64) ghcr.io image. Consumes the
  # per-arch binaries already cosign-signed by the build matrix; no
  # cargo build runs here. Tag matrix follows the standard convention:
  # the full version, the major.minor, the major, and `latest`.
  docker:
    name: docker (ghcr.io)
    needs: [preflight, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Compute version tag components
        id: ver
        shell: bash
        run: |
          version="${{ needs.preflight.outputs.version }}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          echo "major=v${major}" >> "$GITHUB_OUTPUT"
          echo "minor=v${major}.${minor}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage Linux binaries by docker arch
        shell: bash
        run: |
          tag="${{ needs.preflight.outputs.tag }}"
          mkdir -p dist/linux-amd64 dist/linux-arm64
          tar -xzf "artifacts/bomdrift-${tag}-x86_64-unknown-linux-gnu.tar.gz" \
            -C dist/linux-amd64 --strip-components=1 \
            --wildcards '*/bomdrift'
          tar -xzf "artifacts/bomdrift-${tag}-aarch64-unknown-linux-gnu.tar.gz" \
            -C dist/linux-arm64 --strip-components=1 \
            --wildcards '*/bomdrift'
          ls -la dist/linux-amd64 dist/linux-arm64

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/metbcy/bomdrift:${{ needs.preflight.outputs.tag }}
            ghcr.io/metbcy/bomdrift:${{ steps.ver.outputs.minor }}
            ghcr.io/metbcy/bomdrift:${{ steps.ver.outputs.major }}
            ghcr.io/metbcy/bomdrift:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign image with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "ghcr.io/metbcy/bomdrift@${{ steps.build.outputs.digest }}"

      # SLSA build provenance for the multi-arch image. See the
      # equivalent step on the per-target archives for the cosign-vs-SLSA
      # rationale.
      - name: Attest build provenance (image)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/metbcy/bomdrift
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Publish to crates.io. Independent of `docker` and `publish` so a
  # crates.io transient (network, rate-limit, already-published-this-tag)
  # doesn't fail the rest of the release. The CARGO_REGISTRY_TOKEN secret
  # must be set on the repo before the first v0.9.9 tag push.
  cargo-publish:
    name: cargo publish (crates.io)
    needs: [preflight, build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # Force-update the major-version tag to point at this release.
  # GitHub Marketplace + sloppy adopters consume `Metbcy/bomdrift@v1` and
  # expect it to track the latest stable release. During the v0.x line we
  # track v1 (because that's what Marketplace currently references); once
  # v1.0.0 ships, the logic switches to v${major} (so v2 will track v2.x.y).
  retag-major:
    name: retag major version
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Force-update major-version tag to current release
        shell: bash
        run: |
          version="${{ needs.preflight.outputs.version }}"
          tag="${{ needs.preflight.outputs.tag }}"
          major="${version%%.*}"

          # During v0.x, track v1 (Marketplace already pins it).
          # From v1.0.0 onward, track v${major}.
          if [ "$major" -ge 1 ]; then
            major_tag="v${major}"
          else
            major_tag="v1"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f "$major_tag" "$tag"
          git push --force origin "$major_tag"
          echo "Pointed $major_tag at $tag"
